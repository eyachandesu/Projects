<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Feedback</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap">
  <style>
    body { font-family: "Quicksand", sans-serif; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .floating { animation: float 3s ease-in-out infinite; }
    .star { transition: transform 0.2s; }
    .star:hover { transform: scale(1.2); }
  </style>
</head>
<body class="flex min-h-screen items-center justify-center bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100 p-5">
  <main class="my-10 w-full max-w-2xl rounded-[2rem] bg-white/90 p-7 shadow-xl sm:p-10">
    <div class="-mt-16 mb-5 flex justify-center">
      <div class="floating flex h-20 w-20 items-center justify-center rounded-full border-4 border-white bg-gradient-to-br from-pink-400 to-purple-400 shadow-lg">
        <i class="fa-solid fa-comments text-3xl text-white" aria-hidden="true"></i>
      </div>
    </div>

    <header class="mb-8 text-center">
      <p class="mb-2 text-xs font-bold uppercase tracking-[0.2em] text-pink-400">I'd love to hear from you</p>
      <h1 class="text-3xl font-bold text-gray-800">Service Feedback ♡</h1>
      <p class="mt-3 text-sm text-gray-500">Your feedback helps me improve my soul absorbing service and provide a better experience.</p>
    </header>

    <form id="feedbackForm">
      <div class="mb-5">
        <label for="name" class="mb-2 block font-semibold text-gray-700">Your Name <span class="text-sm font-normal text-gray-400">(optional)</span></label>
        <input id="name" name="name" type="text" placeholder="Enter your name" class="w-full rounded-2xl border-2 border-pink-100 bg-pink-50 px-4 py-3 outline-none focus:ring-4 focus:ring-pink-100">
      </div>

      <div class="mb-6">
        <label for="service" class="mb-2 block font-semibold text-gray-700">What service did you receive?</label>
        <select id="service" name="service" required class="w-full rounded-2xl border-2 border-purple-100 bg-purple-50 px-4 py-3 outline-none focus:ring-4 focus:ring-purple-100">
          <option value="">Select a service</option>
          <option value="Vacuum">Vacuum</option>
          <option value="Massage">Massage</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <fieldset class="mb-6 rounded-3xl bg-pink-50 p-6">
        <legend class="sr-only">How satisfied were you?</legend>
        <p class="mb-4 text-center font-semibold text-gray-700" aria-hidden="true">How satisfied were you? ✨</p>
        <div id="starRating" class="flex justify-center gap-3 text-4xl" aria-label="Rating">
          <button type="button" class="star text-gray-300" data-value="1" aria-label="1 star" aria-pressed="false">★</button>
          <button type="button" class="star text-gray-300" data-value="2" aria-label="2 stars" aria-pressed="false">★</button>
          <button type="button" class="star text-gray-300" data-value="3" aria-label="3 stars" aria-pressed="false">★</button>
          <button type="button" class="star text-gray-300" data-value="4" aria-label="4 stars" aria-pressed="false">★</button>
          <button type="button" class="star text-gray-300" data-value="5" aria-label="5 stars" aria-pressed="false">★</button>
        </div>
        <p id="ratingText" class="mt-3 text-center text-sm text-gray-400" aria-live="polite">Tap a star to rate ♡</p>
        <input id="rating" name="rating" type="hidden">
      </fieldset>

      <div class="mb-5">
        <label for="liked" class="mb-2 block font-semibold text-gray-700">What did you like? 💕</label>
        <textarea id="liked" name="liked" rows="3" placeholder="Tell me what you liked..." class="w-full resize-none rounded-2xl border-2 border-pink-100 bg-pink-50 px-4 py-3 outline-none focus:ring-4 focus:ring-pink-100"></textarea>
      </div>

      <div class="mb-5">
        <label for="improvement" class="mb-2 block font-semibold text-gray-700">What can I improve? 🌷</label>
        <textarea id="improvement" name="improvement" rows="3" placeholder="Any suggestions?" class="w-full resize-none rounded-2xl border-2 border-purple-100 bg-purple-50 px-4 py-3 outline-none focus:ring-4 focus:ring-purple-100"></textarea>
      </div>

      <fieldset class="mb-6">
        <legend class="mb-3 font-semibold text-gray-700">Would you recommend my service? 🌸</legend>
        <div class="grid grid-cols-3 gap-3">
          <label class="cursor-pointer">
            <input type="radio" name="recommend" value="Yes" class="peer sr-only" required>
            <span class="block rounded-2xl border-2 border-pink-100 bg-pink-50 py-3 text-center peer-checked:bg-pink-400 peer-checked:text-white peer-focus-visible:ring-4 peer-focus-visible:ring-pink-200">💕 Yes</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="recommend" value="Maybe" class="peer sr-only">
            <span class="block rounded-2xl border-2 border-purple-100 bg-purple-50 py-3 text-center peer-checked:bg-purple-400 peer-checked:text-white peer-focus-visible:ring-4 peer-focus-visible:ring-purple-200">🤔 Maybe</span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="recommend" value="No" class="peer sr-only">
            <span class="block rounded-2xl border-2 border-gray-200 bg-gray-50 py-3 text-center peer-checked:bg-gray-500 peer-checked:text-white peer-focus-visible:ring-4 peer-focus-visible:ring-gray-200">No</span>
          </label>
        </div>
      </fieldset>

      <div class="mb-6">
        <label for="comment" class="mb-2 block font-semibold text-gray-700">Additional Comments 💌</label>
        <textarea id="comment" name="comment" rows="4" placeholder="Anything else you'd like me to know?" class="w-full resize-none rounded-2xl border-2 border-blue-100 bg-blue-50 px-4 py-3 outline-none focus:ring-4 focus:ring-blue-100"></textarea>
      </div>

      <button id="submitButton" type="submit" class="w-full rounded-2xl bg-gradient-to-r from-pink-400 to-purple-400 py-4 font-bold text-white shadow-md transition hover:from-pink-500 hover:to-purple-500 disabled:opacity-60">
        <span id="buttonText">Send Feedback <i class="fa-solid fa-paper-plane ml-2" aria-hidden="true"></i></span>
      </button>
    </form>

    <div id="statusMessage" role="status" aria-live="polite" class="mt-6 hidden rounded-2xl border p-5 text-center"></div>
  </main>

  <script>
    // Deploy the Apps Script as a web app and paste its URL ending in /exec here.
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyFJ9k96HPlka-ICV3xcCF0tP71qmGUvyGBrd2gHgz5txHwp4a8vUr3pR7JNnyyrtaDvw/exec";

    const form = document.getElementById("feedbackForm");
    const stars = [...document.querySelectorAll(".star")];
    const ratingInput = document.getElementById("rating");
    const ratingText = document.getElementById("ratingText");
    const statusMessage = document.getElementById("statusMessage");
    const submitButton = document.getElementById("submitButton");
    const buttonText = document.getElementById("buttonText");
    const defaultButton = buttonText.innerHTML;
    const descriptions = ["", "Very Unsatisfied 😢", "Unsatisfied 🌧️", "Satisfied 😊", "Very Satisfied 💕", "Excellent! ✨"];
    let selectedRating = 0;

    function setRating(rating) {
      selectedRating = rating;
      ratingInput.value = rating || "";
      ratingText.textContent = rating ? descriptions[rating] : "Tap a star to rate ♡";
      ratingText.classList.remove("text-pink-500");
      stars.forEach(star => {
        const active = Number(star.dataset.value) <= rating;
        star.classList.toggle("text-yellow-400", active);
        star.classList.toggle("text-gray-300", !active);
        star.setAttribute("aria-pressed", String(Number(star.dataset.value) === rating));
      });
    }

    function showStatus(message, success) {
      statusMessage.textContent = message;
      statusMessage.className = `mt-6 rounded-2xl border p-5 text-center ${success ? "border-green-200 bg-green-50 text-green-700" : "border-red-200 bg-red-50 text-red-600"}`;
      statusMessage.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    stars.forEach(star => star.addEventListener("click", () => setRating(Number(star.dataset.value))));

    form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (selectedRating === 0) {
    ratingText.textContent = "Please choose a rating first 🌸";
    ratingText.classList.add("text-pink-500");
    return;
  }

  const formData = new FormData(form);

  const data = {
    name: formData.get("name"),
    service: formData.get("service"),
    rating: selectedRating,
    liked: formData.get("liked"),
    improvement: formData.get("improvement"),
    recommend: formData.get("recommend"),
    comment: formData.get("comment")
  };

  try {
    submitButton.disabled = true;

    buttonText.innerHTML = `
      <i class="fa-solid fa-spinner fa-spin mr-2"></i>
      Sending...
    `;

    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify(data)
    });

    // No popup — show message inside the page instead
    showStatus("Thank you! Your feedback has been sent successfully ♡", true);

    // Reset form
    form.reset();
    setRating(0);

  } catch (error) {
    console.error(error);

    // No popup here either
    showStatus("Something went wrong. Please try again.", false);

  } finally {
    submitButton.disabled = false;
    buttonText.innerHTML = defaultButton;
  }
});
  </script>
</body>
</html>
