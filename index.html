<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cute Service Review</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  >

  <!-- Cute Google Font -->
  <link
    href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: "Quicksand", sans-serif;
    }

    /* Cute floating animation */
    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    .floating {
      animation: float 3s ease-in-out infinite;
    }

    /* Star animation */
    .star {
      transition: all 0.2s ease;
    }

    .star:hover {
      transform: scale(1.25) rotate(-8deg);
    }

    /* Cute background dots */
    .dot {
      position: absolute;
      border-radius: 9999px;
      opacity: 0.4;
    }
  </style>
</head>

<body
  class="min-h-screen flex items-center justify-center p-5
         bg-gradient-to-br from-pink-100 via-purple-100 to-blue-100
         relative overflow-hidden"
>

  <!-- Background Decorations -->
  <div class="dot w-32 h-32 bg-pink-300 -top-10 -left-10"></div>
  <div class="dot w-44 h-44 bg-purple-300 -bottom-16 -right-16"></div>

  <div class="absolute top-10 left-[10%] text-pink-300 text-3xl floating">
    <i class="fa-solid fa-heart"></i>
  </div>

  <div
    class="absolute bottom-12 right-[12%] text-purple-300 text-3xl floating"
    style="animation-delay: 1s;"
  >
    <i class="fa-solid fa-star"></i>
  </div>


  <!-- Review Card -->
  <div
    class="relative bg-white/90 backdrop-blur-md
           w-full max-w-lg
           rounded-[2rem]
           shadow-xl
           border border-white
           p-7 sm:p-9"
  >

    <!-- Cute top icon -->
    <div class="flex justify-center -mt-16 mb-4">
      <div
        class="w-20 h-20
               bg-gradient-to-br from-pink-400 to-purple-400
               rounded-full
               flex items-center justify-center
               shadow-lg border-4 border-white
               floating"
      >
        <i class="fa-solid fa-sparkles text-white text-3xl"></i>
      </div>
    </div>


    <!-- Header -->
    <div class="text-center mb-8">

      <p
        class="text-pink-400
               uppercase tracking-[0.2em]
               text-xs font-bold mb-2"
      >
        Your feedback matters
      </p>

      <h1 class="text-3xl font-bold text-gray-800">
        Rate My Service ♡
      </h1>

      <p class="text-gray-500 mt-3 text-sm leading-relaxed">
        I'd love to hear about your experience with my
        <span class="font-semibold text-purple-500">
          vacuum service!
        </span>
      </p>

    </div>


    <!-- Review Form -->
    <form id="reviewForm">

      <!-- Rating Section -->
      <div
        class="bg-pink-50/70
               border border-pink-100
               rounded-3xl
               p-6 mb-6"
      >

        <label
          class="block text-gray-700
                 font-semibold
                 text-center mb-4"
        >
          How was your experience? ✨
        </label>


        <!-- Stars -->
        <div
          id="starRating"
          class="flex justify-center gap-2 sm:gap-4 text-3xl sm:text-4xl"
        >

          <button
            type="button"
            class="star text-gray-300"
            data-value="1"
          >
            <i class="fa-solid fa-star"></i>
          </button>

          <button
            type="button"
            class="star text-gray-300"
            data-value="2"
          >
            <i class="fa-solid fa-star"></i>
          </button>

          <button
            type="button"
            class="star text-gray-300"
            data-value="3"
          >
            <i class="fa-solid fa-star"></i>
          </button>

          <button
            type="button"
            class="star text-gray-300"
            data-value="4"
          >
            <i class="fa-solid fa-star"></i>
          </button>

          <button
            type="button"
            class="star text-gray-300"
            data-value="5"
          >
            <i class="fa-solid fa-star"></i>
          </button>

        </div>


        <!-- Rating Text -->
        <p
          id="ratingText"
          class="text-center text-sm
                 text-gray-400 mt-4 font-medium"
        >
          Tap a star to rate ♡
        </p>

        <input
          type="hidden"
          id="rating"
          name="rating"
          value=""
        >

      </div>


      <!-- Comment -->
      <div class="mb-6">

        <div class="flex justify-between items-center mb-2">

          <label
            for="comment"
            class="text-gray-700 font-semibold"
          >
            Leave a little note 💌
          </label>

          <span
            id="characterCount"
            class="text-xs text-gray-400"
          >
            0 / 300
          </span>

        </div>


        <textarea
          id="comment"
          name="comment"
          rows="5"
          maxlength="300"
          placeholder="Tell me what you loved about the service..."
          class="w-full resize-none
                 bg-purple-50/50
                 border-2 border-purple-100
                 rounded-2xl
                 px-4 py-4
                 text-gray-700
                 placeholder:text-gray-400
                 outline-none
                 transition
                 focus:bg-white
                 focus:ring-4 focus:ring-purple-100
                 focus:border-purple-300"
          required
        ></textarea>

      </div>


      <!-- Submit Button -->
      <button
        type="submit"
        class="group w-full
               bg-gradient-to-r
               from-pink-400 to-purple-400
               hover:from-pink-500 hover:to-purple-500
               text-white
               font-bold
               py-4
               rounded-2xl
               shadow-md
               hover:shadow-lg
               hover:-translate-y-0.5
               transition duration-300"
      >
        Submit My Review

        <i
          class="fa-solid fa-heart
                 ml-2
                 group-hover:scale-125
                 transition"
        ></i>
      </button>

    </form>


    <!-- Success Message -->
    <div
      id="successMessage"
      class="hidden mt-6
             bg-green-50
             border border-green-200
             text-green-700
             p-5 rounded-2xl
             text-center"
    >

      <div class="text-3xl mb-2">
        ♡
      </div>

      <p class="font-bold">
        Thank you so much!
      </p>

      <p class="text-sm mt-1 text-green-600">
        Your sweet feedback means a lot to me.
      </p>

    </div>


    <!-- Footer -->
    <p
      class="text-center
             text-xs text-gray-400
             mt-6"
    >
      Made with
      <span class="text-pink-400">♥</span>
      for happy customers
    </p>

  </div>


  <script>

    const stars = document.querySelectorAll(".star");

    const ratingInput =
      document.getElementById("rating");

    const ratingText =
      document.getElementById("ratingText");

    const reviewForm =
      document.getElementById("reviewForm");

    const successMessage =
      document.getElementById("successMessage");

    const comment =
      document.getElementById("comment");

    const characterCount =
      document.getElementById("characterCount");


    let selectedRating = 0;


    // Cute rating descriptions
    const ratingDescriptions = {
      1: "Oh no! 😢",
      2: "Could be better 🌷",
      3: "It was good! 😊",
      4: "Loved it! 💕",
      5: "Absolutely amazing! ✨"
    };


    // Click Stars
    stars.forEach((star) => {

      star.addEventListener("click", () => {

        selectedRating =
          parseInt(star.dataset.value);

        ratingInput.value =
          selectedRating;

        ratingText.textContent =
          ratingDescriptions[selectedRating];

        updateStars();

      });

    });


    // Hover Preview
    stars.forEach((star) => {

      star.addEventListener("mouseenter", () => {

        const hoverValue =
          parseInt(star.dataset.value);

        stars.forEach((item) => {

          const value =
            parseInt(item.dataset.value);

          if (value <= hoverValue) {

            item.classList.remove("text-gray-300");
            item.classList.add("text-pink-400");

          } else {

            item.classList.remove("text-pink-400");

            if (value > selectedRating) {
              item.classList.add("text-gray-300");
            }

          }

        });

      });

    });


    // Restore selected stars after hover
    document
      .getElementById("starRating")
      .addEventListener("mouseleave", updateStars);


    function updateStars() {

      stars.forEach((star) => {

        const starValue =
          parseInt(star.dataset.value);

        star.classList.remove(
          "text-gray-300",
          "text-pink-400",
          "text-yellow-400"
        );

        if (starValue <= selectedRating) {

          star.classList.add("text-yellow-400");

        } else {

          star.classList.add("text-gray-300");

        }

      });

    }


    // Character Counter
    comment.addEventListener("input", () => {

      characterCount.textContent =
        `${comment.value.length} / 300`;

    });


    // Submit
    reviewForm.addEventListener(
      "submit",
      function(event) {

        event.preventDefault();


        if (selectedRating === 0) {

          ratingText.textContent =
            "Please choose a rating first! 🌸";

          ratingText.classList.add("text-pink-500");

          return;

        }


        // Show success message
        successMessage.classList.remove("hidden");


        // Review data
        console.log({

          rating: selectedRating,

          comment: comment.value

        });


        // Reset form
        reviewForm.reset();

        selectedRating = 0;

        ratingInput.value = "";

        ratingText.textContent =
          "Tap a star to rate ♡";

        ratingText.classList.remove(
          "text-pink-500"
        );

        characterCount.textContent =
          "0 / 300";

        updateStars();


        // Scroll to success message
        successMessage.scrollIntoView({
          behavior: "smooth",
          block: "nearest"
        });

      }
    );

  </script>

</body>
</html>
